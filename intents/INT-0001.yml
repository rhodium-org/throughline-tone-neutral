uid: INT-0001
type: intent
status: approved
title: "Text sounds consistently neutral and approachable"
text: "A neutral register is professional but human: clear, courteous and unfussy. It is the default for most business, service and public-facing writing, where the reader wants to be treated as a competent adult without either stiffness or over-familiarity. This axis governs register — how the writing sounds relative to the reader relationship — not readability, spelling or punctuation, each of which is a separate source. Register variants are mutually exclusive: a consumer composes exactly one of the formal, neutral or informal sibling sources."
normative: false
